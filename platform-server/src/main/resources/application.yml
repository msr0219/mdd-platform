server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: mdd-platform
  datasource:
    url: ${DB_URL:jdbc:h2:file:../data/platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jackson:
    serialization:
      write-dates-as-timestamps: false
platform:
  attachments:
    directory: ${ATTACHMENT_DIR:../uploads}
  auth:
    bootstrap-password: ${ADMIN_INITIAL_PASSWORD:}
    credentials-file: ${ADMIN_CREDENTIALS_FILE:../.logs/admin-initial-password.txt}
  meta-dir: ${META_DIR:../meta}
  demo:
    enabled: ${DEMO_ENABLED:true}
logging:
  level:
    com.platform: INFO
